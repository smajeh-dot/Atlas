[package]
name = "atlas"
version = "0.2.0"
description = "Atlas flashcards"
edition = "2021"

# A workspace so the package reader can be built and tested on any machine,
# without the system libraries the Tauri app needs. The app stays the root
# package, so the exe still lands in src-tauri/target/release.
[workspace]
members = ["crates/anki-package", "crates/atlas-backup"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anki-package = { path = "crates/anki-package" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
