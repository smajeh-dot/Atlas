[package]
name = "anki-package"
version = "0.1.0"
description = "Reads Anki .apkg files into Atlas's staging database"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde_json = "=1.0.154"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "=3.27.0"
