name: Build Atlas.exe

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$conf" ]; then
            echo "Tag v$tag does not match the app version (package.json $pkg, tauri.conf.json $conf)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test Anki package reader and backups
        run: cargo test -p anki-package -p atlas-backup --manifest-path src-tauri/Cargo.toml

      - name: Import a 50,000-note deck
        run: npm run test:scale

      - name: Build Atlas.exe
        run: npm run tauri build -- --no-bundle

      - name: Rename exe
        shell: pwsh
        run: Copy-Item src-tauri/target/release/atlas.exe Atlas.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Atlas
          path: Atlas.exe

      - name: Release name
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Atlas ${{ steps.version.outputs.number }}
          files: Atlas.exe
